<header>
    <span class="zh-content">动画</span>
    <span class="en-content">Animation</span>
</header>
<h2>
    <span class="zh-content">引入</span>
    <span class="en-content">Import</span>
</h2>
<pre tag="javascript">
import { animation } from "vislite"
</pre>
<h2>
    <span class="zh-content">语法</span>
    <span class="en-content">Syntax</span>
</h2>
<pre tag="javascript">
let stop = animation(deep => {
    // 轮询调用，必输
}, duration = 400, deep => {
    // 结束调用，可选
})
</pre>
<p>
    <span class="zh-content">返回一个函数，调用该函数，可以提前结束动画。</span>
    <span class="en-content">Returns a function that can stop the animation early when called.</span>
</p>
